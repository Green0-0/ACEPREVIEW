[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace"
version = "0.1.0"
description = "ACE: discovering agentic coding pipelines with NEAT (evolved worker graphs evaluated on SWE-bench Verified)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "agent2",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]
# scripts/analyze.py, graph_analysis.py, report_stats*.py, swebench_select_candidates.py
analysis = ["numpy", "scipy", "statsmodels", "pandas", "matplotlib", "datasets"]

[tool.uv.sources]
agent2 = { path = "agent2", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
